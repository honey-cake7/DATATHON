batch_processing:
  enabled: true
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2
data:
  datasets:
  - name: I-Haze
    num_images: 25
    path: data/raw/I-Haze
    synthetic: true
  - name: N-Haze
    num_images: 45
    path: data/raw/N-Haze
    synthetic: false
  - name: Dense-Haze
    num_images: 50
    path: data/raw/Dense-Haze
    synthetic: false
  img_format: RGB
  img_size:
  - 256
  - 256
  processed_dir: data/processed
  raw_dir: data/raw
evaluation:
  comparison_output: results/visual_comparisons
  hallucination_check: true
  metrics:
  - psnr
  - ssim
  - lpips
  metrics_output: results/metrics.csv
  psnr:
    enabled: true
    max_pixel_value: 255
  ssim:
    data_range: 255
    enabled: true
    window_size: 11
haze_generation:
  atmospheric_scattering:
    airlight_variation: true
    beta_values:
    - 0.3
    - 0.5
    - 0.8
    - 1.0
  enabled: true
  intensity_range:
  - 0.1
  - 1.0
  methods:
  - atmospheric_scattering
  - gaussian_blur_color_shift
  - depth_based_progressive
  output_dir: data/synthetic_haze
inference:
  batch_size: 1
  device: cuda
  input_dir: data/raw
  num_workers: 4
  output_dir: results/dehazed_images
  save_visualization: true
  visualization_format: jpg
logging:
  level: INFO
  log_dir: results/logs
  log_metrics_interval: 10
  save_plots: true
model:
  checkpoint: models/indoor/dehazeformer-b.pth
  pretrained: true
  primary: dehazeformer
models:
  alternatives:
  - DehazeNet
  - AODNet
  - PFFNet
  - DehazeFormer
  - DCP
  aodnet:
    checkpoint: models/aodnet_pretrained.pth
    depth: 8
    in_channels: 3
    pretrained: true
  dehazeformer:
    checkpoint: models/dehazeformer.pth
    embed_dim: 64
    in_channels: 3
    mlp_ratio: 4.0
    num_blocks: 12
    num_heads: 8
    pretrained: false
    window_size: 8
  dehazenet:
    checkpoint: models/dehazenet.pth
    depth: 20
    pretrained: false
  pffnet:
    checkpoint: models/pffnet.pth
    depth: 8
    pretrained: false
  primary: DehazeFormer
optimization:
  gradient_checkpointing: false
  mixed_precision: true
  model_quantization: false
paths:
  data: data/
  models: models/
  notebooks: notebooks/
  results: results/
  scripts: scripts/
  src: src/
performance:
  hallucination_tolerance: 0.1
  target_psnr: 25.0
  target_ssim: 0.85
project:
  description: Dehazing pipeline with multiple model architectures
  name: Image Dehazing NTIRE Challenge
  version: 1.0.0
training:
  batch_size: 8
  checkpoint_dir: models/checkpoints
  data_augmentation:
    color_jitter: true
    enabled: true
    random_flip: true
    random_rotate: true
  epochs: 100
  learning_rate: 0.0001
  loss_function: l1
  optimizer: adam
  validation_split: 0.2
web:
  flask:
    debug: true
    port: 5000
  framework: gradio
  gradio:
    debug: true
    max_size: 10
    queue: true
    share: false
  host: 0.0.0.0
  port: 7860
